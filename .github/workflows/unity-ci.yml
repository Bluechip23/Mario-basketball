name: Unity CI

# Compiles the project and runs the EditMode tests on every push / PR.
# Requires a Unity license in repo secrets (see docs/CI.md):
#   - Personal license:  UNITY_LICENSE        (contents of your .ulf file)
#   - Pro/Plus license:  UNITY_SERIAL + UNITY_EMAIL + UNITY_PASSWORD
# Without the license secret the job fails at activation.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: unity-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editmode-tests:
    name: EditMode tests (compile + unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cache the imported Library so subsequent runs are much faster.
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.0.23f1
          testMode: editmode
          projectPath: .
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts
